services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookbook
      POSTGRES_PASSWORD: bookbook
      POSTGRES_DB: bookbook_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:

  web:
    build: ./project
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://bookbook:bookbook@db:5432/bookbook_production
      MINIO_PUBLIC_URL: https://minio.bookbook.fredyang.com      RAILS_MASTER_KEY: <your key>
      ADMIN_USERNAME: <you>
      ADMIN_PASSWORD: <secret>
    depends_on:
      - db
      - minio     - minio_data:/data

volumes:
  postgres_data:
  minio_data:
